[project]
name = "transformerbeeclient"
description = "async HTTP client to communicate with transformer.bee/edifact-bo4e-converter"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["edifact", "bo4e", "transformer.bee"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0.0",
    "aiohttp[speedups]>=3.9.3",
    "efoli>=1.4.0",
    "pyjwt",
    "aioauth_client"
]     # add all the dependencies here
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/TransformerBeeClient.py/releases"
Homepage = "https://github.com/Hochfrequenz/TransformerBeeClient.py"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "TC",  # flake8-type-checking
    "S",   # flake8-bandit
    "PIE", # flake8-pie
    "RSE", # flake8-raise
    "ISC", # flake8-implicit-str-concat
]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.per-file-ignores]
# Standing globs (cover files that do not exist yet): mirror the old unittests/.pylintrc and
# integrationtests/.pylintrc disables plus the conventional test-suite relaxations for
# assert-based tests and magic-value comparisons.
"unittests/**" = [
    "S101",    # assert (asserts are the point of a test suite)
    "PLR2004", # magic-value-comparison
    "ARG001",  # unused-function-argument (pytest fixtures)
    "ARG002",  # unused-method-argument (pytest fixtures)
]
"integrationtests/**" = [
    "S101",    # assert (asserts are the point of a test suite)
    "PLR2004", # magic-value-comparison
    "ARG001",  # unused-function-argument (pytest fixtures)
    "ARG002",  # unused-method-argument (pytest fixtures)
]
# Generated grandfather map for pre-existing violations (zero lint churn on existing code).
# New/changed code is held to the full select set above; burn these down in a follow-up.
"integrationtests/conftest.py" = ["E501", "PT003", "UP035"]  # line-too-long, pytest-extraneous-scope-function, deprecated-import
"integrationtests/test_conversion.py" = ["PTH123", "UP015"]  # builtin-open, redundant-open-modes
"src/transformerbeeclient/__init__.py" = ["RUF022", "RUF068"]  # unsorted-dunder-all, duplicate-entry-in-dunder-all
"src/transformerbeeclient/client.py" = ["RET504", "SIM108", "UP006", "UP035", "UP045"]  # unnecessary-assign, if-else-block-instead-of-if-exp, non-pep585-annotation, deprecated-import, non-pep604-annotation-optional
"src/transformerbeeclient/protocols.py" = ["RUF022"]  # unsorted-dunder-all

[tool.pytest.ini_options]
# When the mode is auto, all discovered async tests are considered asyncio-driven
# even if they have no @pytest.mark.asyncio marker.
# https://github.com/pytest-dev/pytest-asyncio#auto-mode
asyncio_mode = "auto"

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "testcontainers==4.13.3"
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"}
]
linting = [
    "ruff==0.16.3",
    {include-group = "tests"}
]
spell_check = [
    "codespell==2.4.3"
]
type_check = [
    "mypy[pydantic]==2.3.0",
    "types-pytz==2026.3.1.20260727",
    "types-docker==7.1.0.20251129",
    {include-group = "tests"}
]
dev = [
    "pre-commit",
    {include-group = "tests"},
    {include-group = "coverage"},
    {include-group = "linting"},
    {include-group = "spell_check"},
    {include-group = "type_check"}
]

[tool.uv]
default-groups = []
# Dev-only constraint (not part of the published runtime contract in [project.dependencies]):
# pyjwt>=2.11 gives jwt.decode a precise return type, which makes `decoded_token.get("exp")`
# resolve to `Any | None` and trips `mypy --strict` on unchanged source in client.py.
# Cap here so the type-check job stays green without touching source or the runtime dependency.
constraint-dependencies = ["pyjwt<2.11"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_transformerbeeclient_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
