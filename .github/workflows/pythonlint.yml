name: "Linting"

on: [push]
jobs:
  pylint:
    name: Python Code Quality and Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linter-env: ["linting", "type_check", "spell_check"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14
      - name: Install Dependencies
        run: uv sync --group ${{ matrix.linter-env }}
      - name: Run ruff check
        if: matrix.linter-env == 'linting'
        run: |
          uv run --locked --group linting ruff check .
      - name: Run mypy
        if: matrix.linter-env == 'type_check'
        run: |
          uv run mypy --show-error-codes src/transformerbeeclient --strict
          uv run mypy --show-error-codes unittests --strict
          uv run mypy --show-error-codes integrationtests --strict
      - name: Run codespell
        if: matrix.linter-env == 'spell_check'
        run: |
          uv run codespell --ignore-words=domain-specific-terms.txt src
          uv run codespell --ignore-words=domain-specific-terms.txt README.md
